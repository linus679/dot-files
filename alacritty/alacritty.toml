# Active theme. Swap the import to change palette:
#   themes/adwaita-light.toml  (matches the XFCE Adwaita GTK theme)
#   themes/adwaita-dark.toml
#   themes/nord.toml
[general]
import = ["themes/adwaita-light.toml"]

[terminal.shell]
program = "/usr/bin/zsh"

[font]
size = 11

[font.normal]
family = "MesloLGS Nerd Font Mono"
style = "Regular"

[font.bold]
family = "MesloLGS Nerd Font Mono"
style = "Bold"

[font.italic]
family = "MesloLGS Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "MesloLGS Nerd Font Mono"
style = "Bold Italic"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
